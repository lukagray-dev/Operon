[package]
name        = "operon-providers"
description = "Provider identity, API credentials, model configuration, and capability metadata for Operon's eleven supported LLM providers."
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

# True root crate — zero operon-* dependencies.
# All four operon-context-normalize-* crates depend on this crate for Provider.
# operon-config will depend on this crate to load ProviderConfig from TOML/env.

[dependencies]
# Serialization: ProviderConfig must round-trip through TOML config files.
serde     = { workspace = true }
serde_json = { workspace = true }

# Error handling for credential validation.
thiserror = { workspace = true }

# HTTP client for model discovery
reqwest = { workspace = true }
tokio = { workspace = true }
