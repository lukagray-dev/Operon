[package]
name        = "operon-tools"
description = "All Operon agent tools and their runtime execution. Organized into groups: fs, web, sub_agents, etc."
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
operon-tools-core.workspace              = true
operon-tools-fs.workspace                = true
operon-tools-fs-read.workspace           = true
operon-tools-fs-grep.workspace           = true
operon-tools-fs-ls.workspace             = true
operon-tools-fs-edit.workspace           = true
operon-tools-fs-write.workspace          = true
operon-tools-fs-append.workspace         = true
operon-tools-fs-delete.workspace         = true
operon-tools-shell.workspace             = true
operon-tools-shell-bash.workspace        = true
operon-tools-web.workspace              = true
operon-tools-web-search.workspace       = true
operon-tools-web-fetch.workspace        = true
operon-tools-todo.workspace              = true
operon-tools-todo-create.workspace       = true
operon-tools-todo-list.workspace         = true
operon-tools-todo-update.workspace       = true
operon-tools-todo-delete.workspace       = true
operon-context-normalize-tools.workspace = true
serde_json.workspace                     = true
tokio.workspace                          = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }

