[package]
name        = "operon-voice"
description = "Local voice-to-text dictation engine — cpal mic capture + whisper.cpp inference, fully offline"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

# Downstream consumers:
#   operon-rs  (facade re-export)
#   gui        (via operon-rs facade — never depend on this crate directly from GUI)

[dependencies]
# Audio capture — cross-platform mic input via WASAPI / CoreAudio / ALSA
cpal.workspace       = true

# Whisper.cpp Rust bindings — local speech-to-text inference
whisper-rs.workspace = true

# Async runtime — channels, spawn_blocking for CPU-bound whisper inference
tokio.workspace      = true

# Error handling
anyhow.workspace     = true
