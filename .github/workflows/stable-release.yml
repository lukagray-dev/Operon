name: Stable Release

# Triggers manually via workflow_dispatch with required inputs
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version tag (e.g., v1.0.0)'
        required: true
        type: string
      release_title:
        description: 'Release title (defaults to Operon GUI {version})'
        required: false
        type: string

jobs:
  test:
    name: Run Workspace Tests
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository with submodules recursively, as required for Operon dependencies
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Install the stable Rust toolchain via dtolnay/rust-toolchain@stable
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Cache the cargo registry and build target directory using Swatinem/rust-cache@v2.
      # To prevent cross-OS cache poisoning, we explicitly suffix the cache key with
      # runner.os and the hash of Cargo.lock.
      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # Install system dependencies required for Linux build/test
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      # Run workspace tests excluding GUI and TUI frontend crates.
      - name: Run cargo test
        run: cargo test --workspace --exclude operon-tui --exclude operon-gui

      # If the tests fail, upload target/debug logs for debugging.
      - name: Upload target/debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-${{ runner.os }}
          path: |
            target/debug/*.log
            target/debug/**/*.log
          if-no-files-found: ignore

  build:
    name: Build Windows GUI Installer
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Install stable Rust with MSVC target on Windows
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Cache cargo registry and target directory. Include shared-key "windows-release"
      # and ensure we prevent cross-OS cache poisoning by adding runner.os and lock hash.
      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # Install tauri-cli locked to version "^2" since gui/src-tauri/Cargo.toml uses Tauri v2.
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Build the production bundle from the gui/ folder.
      - name: Build Tauri App
        run: cargo tauri build
        working-directory: gui

      # Locate the built installer (NSIS .exe preferred, MSI as fallback),
      # and rename it to the formatted release name: operon-gui-{version}.exe.
      # We also save the resulting artifact path to GITHUB_ENV.
      - name: Locate and Rename Installer Artifact
        shell: powershell
        run: |
          $version = "${{ inputs.version }}"
          $nsis = Get-ChildItem "target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
              $dest = "operon-gui-$version.exe"
              Copy-Item $nsis.FullName $dest
              echo "ARTIFACT_PATH=$dest" >> $env:GITHUB_ENV
              echo "Renamed NSIS installer to $dest"
          } else {
              $msi = Get-ChildItem "target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($msi) {
                  $dest = "operon-gui-$version.msi"
                  Copy-Item $msi.FullName $dest
                  echo "ARTIFACT_PATH=$dest" >> $env:GITHUB_ENV
                  echo "Renamed MSI installer fallback to $dest"
              } else {
                  Write-Error "No NSIS (.exe) or MSI (.msi) installer bundle found!"
                  exit 1
              }
          }

      # Upload the renamed installer so it is accessible to the release job.
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: operon-gui-installer
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error

  release:
    name: Create GitHub Stable Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Download the installer compiled in the build job
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: operon-gui-installer
          path: dist

      - name: Checkout repository
        uses: actions/checkout@v4

      # Explicitly tag the current HEAD with the manually provided version and push to remote.
      - name: Create Git Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ inputs.version }}
          git push origin ${{ inputs.version }}

      # Create stable release and upload renamed installer file.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.release_title || format('Operon GUI {0}', inputs.version) }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: dist/operon-gui-${{ inputs.version }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
