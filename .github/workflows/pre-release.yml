name: Pre-Release

# Triggers on push to main
on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Workspace Tests
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository with submodules recursively, as required for Operon dependencies
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Install the stable Rust toolchain via dtolnay/rust-toolchain@stable
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Cache the cargo registry and build target directory using Swatinem/rust-cache@v2.
      # To prevent cross-OS cache poisoning, we explicitly suffix the cache key with
      # runner.os and the hash of Cargo.lock.
      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # Install the system dependencies required to build/test Tauri on Linux.
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      # Run workspace tests excluding the GUI and TUI frontend crates.
      - name: Run cargo test
        run: cargo test --workspace --exclude operon-tui --exclude operon-gui

      # If the tests fail, upload target/debug logs for debugging.
      - name: Upload target/debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-${{ runner.os }}
          path: |
            target/debug/*.log
            target/debug/**/*.log
          if-no-files-found: ignore

  build:
    name: Build Windows GUI Installer
    needs: test
    runs-on: windows-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.NEW_TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Query GitHub API to determine next beta tag matching pattern v0.*.*-beta.
      # Parses latest tag, increments patch version, and handles fallback if no tag exists.
      - name: Determine next version tag
        id: bump
        uses: actions/github-script@v7
        with:
          script: |
            // Fetch up to 100 recent tags from the API
            const { data: tags } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            // Filter for pre-release tags matching pattern v0.*.*-beta
            const betaRegex = /^v0\.\d+\.\d+-beta$/;
            const betaTags = tags
              .map(t => t.name)
              .filter(name => betaRegex.test(name));

            // Helper to extract minor and patch numbers from v0.X.Y-beta
            const parseBetaVersion = (v) => {
              const match = v.match(/^v0\.(\d+)\.(\d+)-beta$/);
              if (!match) return [0, 0];
              return [parseInt(match[1], 10), parseInt(match[2], 10)];
            };

            // Sort tags descending (highest version first)
            betaTags.sort((a, b) => {
              const [minorA, patchA] = parseBetaVersion(a);
              const [minorB, patchB] = parseBetaVersion(b);
              if (minorA !== minorB) return minorB - minorA;
              return patchB - patchA;
            });

            // If no previous beta tags exist, default to v0.0.1-beta.
            // Otherwise, increment the patch number of the latest tag.
            let newTag = 'v0.0.1-beta';
            if (betaTags.length > 0) {
              const latestTag = betaTags[0];
              const [minor, patch] = parseBetaVersion(latestTag);
              newTag = `v0.${minor}.${patch + 1}-beta`;
            }

            console.log(`Latest beta tag found: ${betaTags[0] || 'none'}`);
            console.log(`Computed next beta tag: ${newTag}`);

            // Set both env var and step output
            core.setOutput('NEW_TAG', newTag);
            core.exportVariable('NEW_TAG', newTag);

      # Install stable Rust with MSVC target on Windows
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Cache cargo registry and target directory. Include shared-key "windows-release"
      # and ensure we prevent cross-OS cache poisoning by adding runner.os and lock hash.
      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # Install tauri-cli locked to version "^2" since gui/src-tauri/Cargo.toml uses Tauri v2.
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Build the production bundle from the gui/ folder.
      - name: Build Tauri App
        run: cargo tauri build
        working-directory: gui

      # Locate the built installer (NSIS .exe preferred, MSI as fallback),
      # and rename it to the formatted release name: operon-gui-{NEW_TAG}.exe.
      # We also save the resulting artifact path to GITHUB_ENV.
      - name: Locate and Rename Installer Artifact
        shell: powershell
        run: |
          $tag = "${{ steps.bump.outputs.NEW_TAG }}"
          $nsis = Get-ChildItem "target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
              $dest = "target/release/bundle/nsis/operon-gui-$tag.exe"
              Copy-Item $nsis.FullName $dest
              echo "ARTIFACT_PATH=$dest" >> $env:GITHUB_ENV
              echo "Renamed NSIS installer to $dest"
          } else {
              $msi = Get-ChildItem "target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($msi) {
                  $dest = "target/release/bundle/msi/operon-gui-$tag.exe"
                  Copy-Item $msi.FullName $dest
                  echo "ARTIFACT_PATH=$dest" >> $env:GITHUB_ENV
                  echo "Renamed MSI installer fallback to $dest"
              } else {
                  Write-Error "No NSIS (.exe) or MSI (.msi) installer bundle found!"
                  exit 1
              }
          }

      # Upload the renamed installer so it is accessible to the release job.
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: operon-gui-installer
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error

  release:
    name: Create GitHub Pre-Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Download the installer compiled in the build job
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: operon-gui-installer
          path: dist

      - name: Checkout repository
        uses: actions/checkout@v4

      # Explicitly tag the current HEAD with the calculated version and push to remote.
      - name: Create Git Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.build.outputs.new_tag }}
          git push origin ${{ needs.build.outputs.new_tag }}

      # Create pre-release and upload renamed installer file.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.new_tag }}
          name: Operon GUI ${{ needs.build.outputs.new_tag }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: dist/operon-gui-${{ needs.build.outputs.new_tag }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
