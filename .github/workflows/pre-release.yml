name: Pre-Release

# Triggers on push to main
on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Workspace Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build GUI Frontend
        shell: powershell
        run: |
          cd gui
          npm install
          npm run build
          cd ..

      - name: Build VS Code Extension Frontend
        shell: powershell
        run: |
          cd vscode/extension
          npm install
          npm run build
          cd ../..

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo test
        shell: powershell
        continue-on-error: true
        run: cargo test --workspace

  build:
    name: Build Windows GUI & TUI Binaries
    needs: test
    runs-on: windows-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.NEW_TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Query GitHub API to determine next beta tag matching pattern v0.*.*-beta.
      # Parses latest tag, increments patch version, and handles fallback if no tag exists.
      - name: Determine next version tag
        id: bump
        uses: actions/github-script@v7
        with:
          script: |
            // Fetch up to 100 recent tags from the API
            const { data: tags } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            // Filter for pre-release tags matching pattern v0.*.*-beta
            const betaRegex = /^v0\.\d+\.\d+-beta$/;
            const betaTags = tags
              .map(t => t.name)
              .filter(name => betaRegex.test(name));

            // Helper to extract minor and patch numbers from v0.X.Y-beta
            const parseBetaVersion = (v) => {
              const match = v.match(/^v0\.(\d+)\.(\d+)-beta$/);
              if (!match) return [0, 0];
              return [parseInt(match[1], 10), parseInt(match[2], 10)];
            };

            // Sort tags descending (highest version first)
            betaTags.sort((a, b) => {
              const [minorA, patchA] = parseBetaVersion(a);
              const [minorB, patchB] = parseBetaVersion(b);
              if (minorA !== minorB) return minorB - minorA;
              return patchB - patchA;
            });

            // If no previous beta tags exist, default to v0.0.1-beta.
            // Otherwise, increment the patch number of the latest tag.
            let newTag = 'v0.0.1-beta';
            if (betaTags.length > 0) {
              const latestTag = betaTags[0];
              const [minor, patch] = parseBetaVersion(latestTag);
              newTag = `v0.${minor}.${patch + 1}-beta`;
            }

            console.log(`Latest beta tag found: ${betaTags[0] || 'none'}`);
            console.log(`Computed next beta tag: ${newTag}`);

            // Set both env var and step output
            core.setOutput('NEW_TAG', newTag);
            core.exportVariable('NEW_TAG', newTag);

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build GUI & VS Code Frontends
        shell: powershell
        run: |
          cd gui
          npm install
          npm run build
          cd ../vscode/extension
          npm install
          npm run build
          cd ../..

      # Install stable Rust with MSVC target on Windows
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Cache cargo registry and target directory.
      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # Build the production release binaries for GUI, TUI, and VS Code Bridge
      - name: Build Operon GUI, TUI & VS Code Bridge
        run: |
          cargo build --release -p operon-gui
          cargo build --release -p operon-tui
          cargo build --release -p operon-vscode-bridge

      # Copy and rename standalone binaries to operon-gui-{NEW_TAG}.exe, operon-tui-{NEW_TAG}.exe, operon-vscode-bridge-{NEW_TAG}.exe and package VSIX
      - name: Locate and Package Release Binaries
        shell: powershell
        run: |
          $tag = "${{ steps.bump.outputs.NEW_TAG }}"
          mkdir -p artifacts
          
          $gui_bin = "target/release/operon-gui.exe"
          if (Test-Path $gui_bin) {
              $gui_dest = "artifacts/operon-gui-$tag.exe"
              Copy-Item $gui_bin $gui_dest
              Write-Host "Packaged GUI binary to $gui_dest"
          } else {
              Write-Error "GUI binary not found at $gui_bin!"
              exit 1
          }

          $tui_bin = "target/release/operon-tui.exe"
          if (Test-Path $tui_bin) {
              $tui_dest = "artifacts/operon-tui-$tag.exe"
              Copy-Item $tui_bin $tui_dest
              Write-Host "Packaged TUI binary to $tui_dest"
          } else {
              Write-Error "TUI binary not found at $tui_bin!"
              exit 1
          }

          $bridge_bin = "target/release/operon-vscode-bridge.exe"
          if (Test-Path $bridge_bin) {
              $bridge_dest = "artifacts/operon-vscode-bridge-$tag.exe"
              Copy-Item $bridge_bin $bridge_dest
              Write-Host "Packaged VS Code Bridge binary to $bridge_dest"

              # Place inside extension bin for VSIX packaging
              mkdir -p vscode/extension/bin
              Copy-Item $bridge_bin "vscode/extension/bin/operon-vscode-bridge.exe"
          } else {
              Write-Error "VS Code Bridge binary not found at $bridge_bin!"
              exit 1
          }

          # Package VS Code extension VSIX
          try {
              cd vscode/extension
              npx -y @vscode/vsce package --no-dependencies --out "../../artifacts/operon-vscode-$tag.vsix"
              cd ../..
              Write-Host "Packaged VS Code Extension to artifacts/operon-vscode-$tag.vsix"
          } catch {
              Write-Warning "VSIX packaging skipped or failed: $_"
          }

      # Upload the packaged binaries for the release job
      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: operon-binaries
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Create GitHub Pre-Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download the binaries compiled in the build job
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: operon-binaries
          path: dist

      # Delete any existing GitHub release and tag associated with this version if needed
      - name: Delete existing GitHub release and tag
        run: |
          gh release delete ${{ needs.build.outputs.new_tag }} --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Explicitly tag the current HEAD with the calculated version and push to remote
      - name: Create Git Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.build.outputs.new_tag }}
          git push origin ${{ needs.build.outputs.new_tag }}

      # Create pre-release and upload both GUI and TUI binaries
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.new_tag }}
          name: Operon ${{ needs.build.outputs.new_tag }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
