[workspace]
resolver = "2"
members = [
    # Facade crate — public API surface for TUI/GUI
    "operon-rs",

    # Context pipeline — orchestrating facade
    "crates/operon-context",

    # Context sub-crates
    "crates/operon-context/src/operon-context-token-tracker",
    "crates/operon-context/src/operon-context-snapshot",
    "crates/operon-context/src/operon-context-sanitizer",
    "crates/operon-context/src/operon-context-compaction",

    # Normalize facade + sub-crates (replaces the old operon-context-tools)
    "crates/operon-context/src/operon-context-normalize",
    "crates/operon-context/src/operon-context-normalize/src/operon-context-normalize-tools",
    "crates/operon-context/src/operon-context-normalize/src/operon-context-normalize-reasoning",
    "crates/operon-context/src/operon-context-normalize/src/operon-context-normalize-messages",
    "crates/operon-context/src/operon-context-normalize/src/operon-context-normalize-stream",

    # Frontends
    "tui",
    "gui/src-tauri",
]

[workspace.dependencies]
tokio        = { version = "1",    features = ["full"] }
async-trait  = "0.1"
anyhow       = "1"
thiserror    = "2"
serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
futures      = "0.3"
tracing      = "0.1"
reqwest      = { version = "0.12", features = ["json", "stream"] }
dirs         = "5.0"
toml         = "0.8"

# Internal crates
operon-context-token-tracker = { path = "crates/operon-context/src/operon-context-token-tracker", features = ["bpe"] }
operon-context-snapshot      = { path = "crates/operon-context/src/operon-context-snapshot" }
operon-context-sanitizer     = { path = "crates/operon-context/src/operon-context-sanitizer" }
operon-context-compaction    = { path = "crates/operon-context/src/operon-context-compaction" }

operon-context-normalize              = { path = "crates/operon-context/src/operon-context-normalize" }
operon-context-normalize-tools        = { path = "crates/operon-context/src/operon-context-normalize/src/operon-context-normalize-tools" }
operon-context-normalize-reasoning    = { path = "crates/operon-context/src/operon-context-normalize/src/operon-context-normalize-reasoning" }
operon-context-normalize-messages     = { path = "crates/operon-context/src/operon-context-normalize/src/operon-context-normalize-messages" }
operon-context-normalize-stream       = { path = "crates/operon-context/src/operon-context-normalize/src/operon-context-normalize-stream" }

operon-context = { path = "crates/operon-context" }

[workspace.package]
version    = "0.1.0"
edition    = "2021"
authors    = ["Soumo Mukherjee <heylukagray@gmail.com>"]
license    = "AGPL-3.0"
repository = "https://github.com/lukagray-dev/operon"
