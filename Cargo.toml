[workspace]
resolver = "2"
members = [
    # Facade crate — public API surface for TUI/GUI
    "operon-rs",

    # Context pipeline — orchestrating facade
    "operon-rs/src/operon-context",

    # Context sub-crates
    "operon-rs/src/operon-context/src/operon-context-token-tracker",
    "operon-rs/src/operon-context/src/operon-context-snapshot",
    "operon-rs/src/operon-context/src/operon-context-sanitizer",
    "operon-rs/src/operon-context/src/operon-context-compaction",

    # Normalize facade + sub-crates (replaces the old operon-context-tools)
    "operon-rs/src/operon-context/src/operon-context-normalize",
    "operon-rs/src/operon-context/src/operon-context-normalize/src/operon-context-normalize-tools",
    "operon-rs/src/operon-context/src/operon-context-normalize/src/operon-context-normalize-reasoning",
    "operon-rs/src/operon-context/src/operon-context-normalize/src/operon-context-normalize-messages",
    "operon-rs/src/operon-context/src/operon-context-normalize/src/operon-context-normalize-stream",

    # Tools — agent tool implementations
    "operon-rs/src/operon-tools",

    # Tools — shared core
    "operon-rs/src/operon-tools/src/core",

    # File-system tools
    "operon-rs/src/operon-tools/src/fs",
    "operon-rs/src/operon-tools/src/fs/src/read",
    "operon-rs/src/operon-tools/src/fs/src/grep",
    "operon-rs/src/operon-tools/src/fs/src/ls",
    "operon-rs/src/operon-tools/src/fs/src/edit",
    "operon-rs/src/operon-tools/src/fs/src/write",
    "operon-rs/src/operon-tools/src/fs/src/append",
    "operon-rs/src/operon-tools/src/fs/src/delete",
    "operon-rs/src/operon-tools/src/fs/src/glob",

    # Shell tool
    "operon-rs/src/operon-tools/src/shell",
    "operon-rs/src/operon-tools/src/shell/src/bash",

    # Web tools
    "operon-rs/src/operon-tools/src/web",
    "operon-rs/src/operon-tools/src/web/src/web_search",
    "operon-rs/src/operon-tools/src/web/src/web_fetch",

    # Todo tools
    "operon-rs/src/operon-tools/src/todo",
    "operon-rs/src/operon-tools/src/todo/src/todo_create",
    "operon-rs/src/operon-tools/src/todo/src/todo_list",
    "operon-rs/src/operon-tools/src/todo/src/todo_update",
    "operon-rs/src/operon-tools/src/todo/src/todo_delete",

    # Memory tools — global persistent SQLite-backed memory subsystem
    "operon-rs/src/operon-tools/src/memory",
    "operon-rs/src/operon-tools/src/memory/src/store",
    "operon-rs/src/operon-tools/src/memory/src/memory_add",
    "operon-rs/src/operon-tools/src/memory/src/memory_edit",
    "operon-rs/src/operon-tools/src/memory/src/memory_delete",
    "operon-rs/src/operon-tools/src/memory/src/memory_retrieve",
    "operon-rs/src/operon-tools/src/memory/src/memory_search",

    # Ask tool
    "operon-rs/src/operon-tools/src/ask",

    # Events bus — pure types, no async
    "operon-rs/src/operon-events",

    # Providers — Provider enum, ApiCredentials, ModelConfig, ProviderConfig (root crate, zero operon-* deps)
    "operon-rs/src/operon-providers",

    # Config — config.toml loading, path resolution, env var overrides
    "operon-rs/src/operon-config",

    # Policy — permission enforcement gate (sits between session and tools)
    "operon-rs/src/operon-policy",

    # Session — agent loop, HTTP, tool dispatch, persistence
    "operon-rs/src/operon-session",

    # Frontends
    "tui",
    "gui/src-tauri",
    "vscode/bridge",

    # Terminal Crate
    "operon-rs/src/operon-terminal",
    "operon-rs/src/operon-diff",

    # Channels facade & sub-crates
    "operon-rs/src/operon-channels",
    "operon-rs/src/operon-channels/src/whatsapp",
    "operon-rs/src/operon-channels/src/telegram",
    "operon-rs/src/operon-channels/src/discord",
    "operon-rs/src/operon-channels/src/slack",
    "operon-rs/src/operon-channels/src/feishu",
]

[workspace.dependencies]
# ── Workspace shared deps ─────────────────────────────────────────────────────
tokio        = { version = "1.52.3",    features = ["full"] }
async-trait  = "0.1.89"
anyhow       = "1.0.102"
thiserror    = "2.0.18"
serde        = { version = "1.0.228",    features = ["derive"] }
serde_json   = "1.0.150"
futures      = "0.3.32"
tracing      = "0.1.44"
reqwest      = { version = "0.13.4", features = ["json", "stream"] }
dirs         = "6.0.0"
toml         = "1.1.2"
toml_edit    = "0.25.12"
ignore       = "0.4.25"
grep-searcher = "0.1"
grep-regex    = "0.1"
grep-matcher  = "0.1"
git2         = { version = "0.21.0", default-features = false }
auth-git2    = "0.6"
notify       = "8.2.0"
tempfile     = "3.15.0"
globset      = "0.4"
trash        = "5"
duckduckgo   = "0.3"
htmd         = "0.5"
pulldown-cmark = "0.11.3"

# ── Token Tracking ────────────────────────────────────────────────────────────
tiktoken = "3"

# ── UI & Frontends (TUI & GUI) ────────────────────────────────────────────────
ratatui      = "0.30.0"
crossterm    = "0.29.0"
arboard      = "3.6.1"
rfd          = "0.15"
regex        = "1.10"
windows-sys  = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Threading", "Win32_Graphics_Dwm", "Win32_UI_Shell"] }
sha2         = "0.10"
base64       = "0.22"

# ── Channels (WhatsApp & Telegram) ────────────────────────────────────────────
parking_lot                   = "0.12"
bytes                         = "1"
prost                         = "0.14"
chrono                        = "0.4"
rusqlite                      = { version = "0.31", features = ["bundled"] }
whatsapp-rust                 = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "cbcdd2a6b931d804f3c2693554dce75e654834e3", default-features = false, features = ["tokio-runtime"] }
whatsapp-rust-tokio-transport = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "cbcdd2a6b931d804f3c2693554dce75e654834e3", default-features = false }
whatsapp-rust-ureq-http-client= { git = "https://github.com/oxidezap/whatsapp-rust", rev = "cbcdd2a6b931d804f3c2693554dce75e654834e3" }
wacore                        = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "cbcdd2a6b931d804f3c2693554dce75e654834e3", default-features = false }
wacore-binary                 = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "cbcdd2a6b931d804f3c2693554dce75e654834e3", default-features = false }
waproto                       = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "cbcdd2a6b931d804f3c2693554dce75e654834e3", default-features = false }
windows-acl                   = "0.3"
winapi                        = { version = "0.3", features = ["processthreadsapi", "securitybaseapi", "winnt", "handleapi"] }

# ── Third party dependencies ──────────────────────────────────────────────────
portable-pty     = "0.8"
qrcode           = "0.14"
tokio-tungstenite = { version = "0.26", features = ["connect", "handshake", "native-tls"] }

# ── SQLite persistence (used by operon-session) ───────────────────────────────
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }

# ── Internal Crates ───────────────────────────────────────────────────────────
operon-rs = { path = "operon-rs" }

# features = ["bpe"] is Operon's activation of the BPE feature in the token-tracker.
# The crate defines it; we opt in here. Other devs using the crate standalone get
# the default heuristic estimator unless they activate it themselves.
operon-context-token-tracker          = { path = "operon-rs/src/operon-context/src/operon-context-token-tracker", features = ["bpe"] }
operon-context-snapshot               = { path = "operon-rs/src/operon-context/src/operon-context-snapshot" }
operon-context-sanitizer              = { path = "operon-rs/src/operon-context/src/operon-context-sanitizer" }
operon-context-compaction             = { path = "operon-rs/src/operon-context/src/operon-context-compaction" }

operon-context-normalize              = { path = "operon-rs/src/operon-context/src/operon-context-normalize" }
operon-context-normalize-tools        = { path = "operon-rs/src/operon-context/src/operon-context-normalize/src/operon-context-normalize-tools" }
operon-context-normalize-reasoning    = { path = "operon-rs/src/operon-context/src/operon-context-normalize/src/operon-context-normalize-reasoning" }
operon-context-normalize-messages     = { path = "operon-rs/src/operon-context/src/operon-context-normalize/src/operon-context-normalize-messages" }
operon-context-normalize-stream       = { path = "operon-rs/src/operon-context/src/operon-context-normalize/src/operon-context-normalize-stream" }

operon-context = { path = "operon-rs/src/operon-context" }

operon-tools-core                     = { path = "operon-rs/src/operon-tools/src/core" }
operon-tools-fs-read                  = { path = "operon-rs/src/operon-tools/src/fs/src/read" }
operon-tools-fs-grep                  = { path = "operon-rs/src/operon-tools/src/fs/src/grep" }
operon-tools-fs-ls                    = { path = "operon-rs/src/operon-tools/src/fs/src/ls" }
operon-tools-fs-edit                  = { path = "operon-rs/src/operon-tools/src/fs/src/edit" }
operon-tools-fs-write                 = { path = "operon-rs/src/operon-tools/src/fs/src/write" }
operon-tools-fs-append                = { path = "operon-rs/src/operon-tools/src/fs/src/append" }
operon-tools-fs-delete                = { path = "operon-rs/src/operon-tools/src/fs/src/delete" }
operon-tools-fs-glob                  = { path = "operon-rs/src/operon-tools/src/fs/src/glob" }
operon-tools-shell                    = { path = "operon-rs/src/operon-tools/src/shell" }
operon-tools-shell-bash               = { path = "operon-rs/src/operon-tools/src/shell/src/bash" }
operon-tools-web                      = { path = "operon-rs/src/operon-tools/src/web" }
operon-tools-web-search               = { path = "operon-rs/src/operon-tools/src/web/src/web_search" }
operon-tools-web-fetch                = { path = "operon-rs/src/operon-tools/src/web/src/web_fetch" }
operon-tools-todo                     = { path = "operon-rs/src/operon-tools/src/todo" }
operon-tools-todo-create              = { path = "operon-rs/src/operon-tools/src/todo/src/todo_create" }
operon-tools-todo-list                = { path = "operon-rs/src/operon-tools/src/todo/src/todo_list" }
operon-tools-todo-update              = { path = "operon-rs/src/operon-tools/src/todo/src/todo_update" }
operon-tools-todo-delete              = { path = "operon-rs/src/operon-tools/src/todo/src/todo_delete" }
# Memory tools — leaf store crate first, then five tool sub-crates, then facade
operon-tools-memory-store             = { path = "operon-rs/src/operon-tools/src/memory/src/store" }
operon-tools-memory-add               = { path = "operon-rs/src/operon-tools/src/memory/src/memory_add" }
operon-tools-memory-edit              = { path = "operon-rs/src/operon-tools/src/memory/src/memory_edit" }
operon-tools-memory-delete            = { path = "operon-rs/src/operon-tools/src/memory/src/memory_delete" }
operon-tools-memory-retrieve          = { path = "operon-rs/src/operon-tools/src/memory/src/memory_retrieve" }
operon-tools-memory-search            = { path = "operon-rs/src/operon-tools/src/memory/src/memory_search" }
operon-tools-memory                   = { path = "operon-rs/src/operon-tools/src/memory" }
operon-tools-ask                      = { path = "operon-rs/src/operon-tools/src/ask" }
operon-tools-fs                       = { path = "operon-rs/src/operon-tools/src/fs" }
operon-tools                          = { path = "operon-rs/src/operon-tools" }

# Events, policy, config, and session crates
operon-events    = { path = "operon-rs/src/operon-events" }
operon-providers = { path = "operon-rs/src/operon-providers" }
operon-config    = { path = "operon-rs/src/operon-config" }
operon-policy    = { path = "operon-rs/src/operon-policy" }
operon-session   = { path = "operon-rs/src/operon-session" }
# operon-markdown  = { path = "operon-rs/src/operon-markdown" }
operon-terminal  = { path = "operon-rs/src/operon-terminal" }
operon-diff      = { path = "operon-rs/src/operon-diff" }
operon-channels  = { path = "operon-rs/src/operon-channels" }
operon-channels-whatsapp = { path = "operon-rs/src/operon-channels/src/whatsapp" }
operon-channels-telegram = { path = "operon-rs/src/operon-channels/src/telegram" }
operon-channels-discord  = { path = "operon-rs/src/operon-channels/src/discord" }
operon-channels-slack    = { path = "operon-rs/src/operon-channels/src/slack" }
operon-channels-feishu   = { path = "operon-rs/src/operon-channels/src/feishu" }

[workspace.package]
version    = "0.1.0"
edition    = "2021"
authors    = ["Soumo Mukherjee <heylukagray@gmail.com>"]
license    = "AGPL-3.0"
repository = "https://github.com/lukagray-dev/operon"

[profile.release]
codegen-units = 1
lto = true
