<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operon</title>
    <!-- Global tokens and shared styles -->
    <link rel="stylesheet" href="./css/shared/tokens.css">
    <!-- Titlebar styles -->
    <link rel="stylesheet" href="./css/titlebar/titlebar.css">
    <!-- Left sidebar styles -->
    <link rel="stylesheet" href="./css/left-sidebar/left-sidebar.css">
</head>
<body>
    <!-- Custom Titlebar -->
    <div class="titlebar">
        <!-- LEFT SECTION: Logo, Navigation, Menu -->
        <div class="titlebar__left">
            <!-- Brand Logo -->
            <div class="titlebar__logo">
                <img 
                    src="./assets/brand/operon.svg" 
                    alt="Operon Logo" 
                    class="titlebar__logo-icon"
                />
            </div>

            <!-- Navigation Controls (Back/Forward) -->
            <nav class="titlebar__navigation">
                <button 
                    id="titlebar-nav-back" 
                    class="titlebar__nav-btn" 
                    aria-label="Navigate back"
                    title="Go back"
                >
                    <img 
                        src="./assets/icons/action/arrow-left.svg" 
                        alt="Back" 
                        class="titlebar__nav-icon"
                    />
                </button>
                <button 
                    id="titlebar-nav-forward" 
                    class="titlebar__nav-btn" 
                    aria-label="Navigate forward"
                    title="Go forward"
                >
                    <img 
                        src="./assets/icons/action/arrow-right.svg" 
                        alt="Forward" 
                        class="titlebar__nav-icon"
                    />
                </button>
            </nav>

            <!-- Menu Bar -->
            <div class="titlebar__menu">
                <!-- Files Menu -->
                <div class="titlebar__menu-item" data-menu="files">
                    <span>Files</span>
                    <div class="titlebar__dropdown">
                        <ul class="titlebar__dropdown-list">
                            <li>
                                <button 
                                    id="menu-new-conversation" 
                                    class="titlebar__dropdown-item"
                                >
                                    New conversation
                                </button>
                            </li>
                            <li>
                                <button 
                                    id="menu-settings" 
                                    class="titlebar__dropdown-item"
                                >
                                    Settings
                                </button>
                            </li>
                            <li>
                                <div class="titlebar__dropdown-separator"></div>
                            </li>
                            <li>
                                <button 
                                    id="menu-open-project" 
                                    class="titlebar__dropdown-item"
                                >
                                    Open project
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- View Menu -->
                <div class="titlebar__menu-item" data-menu="view">
                    <span>View</span>
                    <div class="titlebar__dropdown">
                        <ul class="titlebar__dropdown-list">
                            <li>
                                <button 
                                    id="menu-reload" 
                                    class="titlebar__dropdown-item"
                                >
                                    Reload
                                </button>
                            </li>
                            <li>
                                <button 
                                    id="menu-zoom-in" 
                                    class="titlebar__dropdown-item"
                                >
                                    Zoom in
                                </button>
                            </li>
                            <li>
                                <button 
                                    id="menu-zoom-out" 
                                    class="titlebar__dropdown-item"
                                >
                                    Zoom out
                                </button>
                            </li>
                            <li>
                                <button 
                                    id="menu-actual-size" 
                                    class="titlebar__dropdown-item"
                                >
                                    Actual size
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Window Menu -->
                <div class="titlebar__menu-item" data-menu="window">
                    <span>Window</span>
                    <div class="titlebar__dropdown">
                        <ul class="titlebar__dropdown-list">
                            <li>
                                <button 
                                    id="menu-close-window" 
                                    class="titlebar__dropdown-item"
                                >
                                    Close window
                                </button>
                            </li>
                            <li>
                                <button 
                                    id="menu-exit" 
                                    class="titlebar__dropdown-item"
                                >
                                    Exit
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Help Menu -->
                <div class="titlebar__menu-item" data-menu="help">
                    <span>Help</span>
                    <div class="titlebar__dropdown">
                        <ul class="titlebar__dropdown-list">
                            <li>
                                <button 
                                    id="menu-documentation" 
                                    class="titlebar__dropdown-item"
                                >
                                    Documentation
                                </button>
                            </li>
                            <li>
                                <button 
                                    id="menu-check-update" 
                                    class="titlebar__dropdown-item"
                                >
                                    Check for update
                                </button>
                            </li>
                            <li>
                                <button 
                                    id="menu-report-bug" 
                                    class="titlebar__dropdown-item"
                                >
                                    Report bug
                                </button>
                            </li>
                            <li>
                                <button 
                                    id="menu-about" 
                                    class="titlebar__dropdown-item"
                                >
                                    About
                                </button>
                            </li>
                            <li>
                                <button 
                                    id="menu-follow-creator" 
                                    class="titlebar__dropdown-item"
                                >
                                    Follow creator
                                </button>
                            </li>
                            <li>
                                <button 
                                    id="menu-see-repo" 
                                    class="titlebar__dropdown-item"
                                >
                                    See repo
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT SECTION: Window Controls -->
        <div class="titlebar__right">
            <div class="titlebar__window-controls">
                <!-- Minimize Button -->
                <button 
                    id="titlebar-minimize" 
                    class="titlebar__control-btn" 
                    aria-label="Minimize window"
                    title="Minimize"
                >
                    <img 
                        src="./assets/icons/action/minimize.svg" 
                        alt="Minimize" 
                        class="titlebar__control-icon"
                    />
                </button>

                <!-- Maximize/Unmaximize Button -->
                <button 
                    id="titlebar-maximize" 
                    class="titlebar__control-btn" 
                    aria-label="Maximize window"
                    title="Maximize"
                >
                    <img 
                        src="./assets/icons/action/maximize.svg" 
                        alt="Maximize" 
                        class="titlebar__control-icon titlebar__control-icon--maximize"
                    />
                    <img 
                        src="./assets/icons/action/unmaxmize.svg" 
                        alt="Restore" 
                        class="titlebar__control-icon titlebar__control-icon--unmaximize"
                    />
                </button>

                <!-- Close Button -->
                <button 
                    id="titlebar-close" 
                    class="titlebar__control-btn titlebar__control-btn--close" 
                    aria-label="Close window"
                    title="Close"
                >
                    <img 
                        src="./assets/icons/action/close.svg" 
                        alt="Close" 
                        class="titlebar__control-icon"
                    />
                </button>
            </div>
        </div>
    </div>

    <!-- Main Application Content -->
    <div id="app">
        <!-- Left Sidebar -->
        <aside class="left-sidebar">
            <!-- Top Actions Section -->
            <div class="left-sidebar__top">
                <!-- New Chat Button -->
                <button 
                    id="sidebar-new-chat" 
                    class="left-sidebar__action-btn"
                    aria-label="Create new chat"
                    title="New chat"
                >
                    <img 
                        src="./assets/icons/sidebar/new-chat.svg" 
                        alt="New chat" 
                        class="left-sidebar__action-icon"
                    />
                    <span class="left-sidebar__action-text">New chat</span>
                </button>

                <!-- Search Button -->
                <button 
                    id="sidebar-search" 
                    class="left-sidebar__action-btn"
                    aria-label="Search chats"
                    title="Search"
                >
                    <img 
                        src="./assets/icons/sidebar/search.svg" 
                        alt="Search" 
                        class="left-sidebar__action-icon"
                    />
                    <span class="left-sidebar__action-text">Search</span>
                </button>

                <!-- Plugins Button -->
                <button 
                    id="sidebar-plugins" 
                    class="left-sidebar__action-btn"
                    aria-label="Manage plugins"
                    title="Plugins"
                >
                    <img 
                        src="./assets/icons/sidebar/plugins.svg" 
                        alt="Plugins" 
                        class="left-sidebar__action-icon"
                    />
                    <span class="left-sidebar__action-text">Plugins</span>
                </button>
            </div>

            <!-- Scrollable Content Area -->
            <div class="left-sidebar__content">
                <!-- Projects Section -->
                <div class="left-sidebar__section">
                    <div class="left-sidebar__section-header">
                        <button 
                            class="left-sidebar__section-toggle"
                            aria-label="Toggle projects section"
                            data-section="projects"
                        >
                            <img 
                                src="./assets/icons/sidebar/projects.svg" 
                                alt="Projects" 
                                class="left-sidebar__section-icon"
                            />
                            <span class="left-sidebar__section-title">Projects</span>
                            <img 
                                src="./assets/icons/sidebar/chevron-down.svg" 
                                alt="Toggle" 
                                class="left-sidebar__section-chevron"
                            />
                        </button>
                    </div>
                    <div class="left-sidebar__section-content" data-section-content="projects">
                        <!-- Projects will be dynamically rendered here -->
                    </div>
                </div>

                <!-- Chats Section -->
                <div class="left-sidebar__section">
                    <div class="left-sidebar__section-header">
                        <button 
                            class="left-sidebar__section-toggle"
                            aria-label="Toggle chats section"
                            data-section="chats"
                        >
                            <img 
                                src="./assets/icons/sidebar/chats.svg" 
                                alt="Chats" 
                                class="left-sidebar__section-icon"
                            />
                            <span class="left-sidebar__section-title">Chats</span>
                            <img 
                                src="./assets/icons/sidebar/chevron-down.svg" 
                                alt="Toggle" 
                                class="left-sidebar__section-chevron"
                            />
                        </button>
                    </div>
                    <div class="left-sidebar__section-content" data-section-content="chats">
                        <!-- Chats will be dynamically rendered here -->
                    </div>
                </div>
            </div>

            <!-- Bottom Section (Settings) -->
            <div class="left-sidebar__bottom">
                <button 
                    id="sidebar-settings" 
                    class="left-sidebar__action-btn"
                    aria-label="Open settings"
                    title="Settings"
                >
                    <img 
                        src="./assets/icons/sidebar/settings.svg" 
                        alt="Settings" 
                        class="left-sidebar__action-icon"
                    />
                    <span class="left-sidebar__action-text">Settings</span>
                </button>
            </div>

            <!-- Resize Handle -->
            <div class="left-sidebar__resize-handle" aria-label="Resize sidebar"></div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Main content will be rendered here -->
        </main>
    </div>

    <!-- JavaScript modules -->
    <script type="module" src="main.js"></script>
</body>
</html>
