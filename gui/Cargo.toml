[package]
name        = "operon-gui"
description = "Operon graphical UI frontend (Slint-based)"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
build = "build.rs"

[dependencies]
# ── Workspace shared deps ─────────────────────────────────────────────────────
tokio.workspace       = true
async-trait.workspace = true
anyhow.workspace      = true
serde.workspace       = true
toml.workspace        = true
dirs.workspace        = true
serde_json.workspace  = true
notify.workspace      = true
tracing.workspace     = true

# ── Internal Crates ───────────────────────────────────────────────────────────
operon-rs.workspace                = true
operon-channels-whatsapp.workspace = true
operon-channels-telegram.workspace = true

# ── GUI deps ──────────────────────────────────────────────────────────────────
rfd.workspace            = true
arboard.workspace        = true
pulldown-cmark.workspace = true
syntect.workspace        = true
merman.workspace         = true
regex.workspace          = true
windows-sys.workspace    = true
sha2.workspace           = true
base64.workspace         = true
slint.workspace          = true
tray-icon.workspace      = true
auto-launch.workspace    = true
image.workspace          = true

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
# Slint build script — compiles .slint files to Rust
slint-build.workspace = true
resvg.workspace       = true
tiny-skia.workspace   = true
png.workspace         = true
ico.workspace         = true
