[package]
name        = "operon-gui"
description = "Operon graphical UI frontend (Slint-based)"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
build = "build.rs"

[dependencies]
# ── Workspace shared deps ─────────────────────────────────────────────────────
tokio.workspace       = true
async-trait.workspace = true
anyhow.workspace      = true
serde.workspace       = true
toml.workspace        = true
dirs.workspace        = true
serde_json.workspace  = true

operon-rs = { path = "../operon-rs" }
rfd = "0.15"
arboard = "3.6.1"
pulldown-cmark = "0.11"

# ── GUI-only deps (not shared — Slint UI specific) ────────────────────────────

# Slint GUI framework — declarative UI language and runtime
slint = { version = "1.16.1", features = ["unstable-winit-030", "renderer-skia"] }

[build-dependencies]
# Slint build script — compiles .slint files to Rust
slint-build = "1.16.1"
