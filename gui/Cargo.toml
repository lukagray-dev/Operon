[package]
name        = "operon-gui"
description = "Operon graphical UI frontend (Slint-based)"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
build = "build.rs"

[dependencies]
# ── Workspace shared deps ─────────────────────────────────────────────────────
tokio.workspace       = true
async-trait.workspace = true
anyhow.workspace      = true
serde.workspace       = true
toml.workspace        = true
dirs.workspace        = true
serde_json.workspace  = true
notify.workspace      = true

operon-rs = { path = "../operon-rs" }
operon-channels-whatsapp = { path = "../operon-rs/src/operon-channels/src/whatsapp" }
operon-channels-telegram = { path = "../operon-rs/src/operon-channels/src/telegram" }
rfd = "0.15"
arboard = "3.6.1"
pulldown-cmark.workspace = true
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "default-themes", "default-syntaxes"] }
merman = { version = "0.7", features = ["render"] }
regex = "1.10"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Threading"] }
sha2 = "0.10"
base64 = "0.22"

slint = { version = "1.16.1", features = ["unstable-winit-030", "renderer-skia"] }

# ── GUI-only deps (not shared — Slint UI specific) ────────────────────────────

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
# Slint build script — compiles .slint files to Rust
slint-build = "1.16.1"
