[package]
name        = "operon-gui"
description = "Operon graphical UI frontend (Tauri)"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio.workspace       = true
async-trait.workspace = true
anyhow.workspace      = true
serde.workspace       = true
serde_json.workspace  = true
tracing.workspace     = true

# Backend facade - single dependency for the GUI
operon-rs = { path = "../../operon-rs" }

# Tauri framework for building desktop apps with web frontend
tauri = { version = "2", features = [] }

# Tauri plugin for opening URLs and files in default applications
tauri-plugin-opener = "2"

# Tauri plugin for dialogs (folder picker)
tauri-plugin-dialog = "2"
