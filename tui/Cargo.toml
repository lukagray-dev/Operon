[package]
name        = "operon-tui"
description = "Operon terminal UI frontend"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
# ── Workspace shared deps ─────────────────────────────────────────────────────
operon-rs.workspace   = true
tokio.workspace       = true
async-trait.workspace = true
anyhow.workspace      = true
serde.workspace       = true
toml.workspace        = true
dirs.workspace        = true

# ── Terminal UI deps ──────────────────────────────────────────────────────────
# Production-grade text input widget — cursor, undo/redo, multi-line editing
tui-textarea = { path = "src/vendor/tui-textarea" }

# Terminal UI framework
ratatui.workspace = true

# Low-level terminal control — raw mode, alternate screen, keyboard/mouse events
crossterm.workspace = true

# Cross-platform clipboard access
arboard.workspace = true
