[package]
name        = "operon-tui"
description = "Operon terminal UI frontend"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
# ── Workspace shared deps ─────────────────────────────────────────────────────
tokio.workspace       = true
async-trait.workspace = true
anyhow.workspace      = true
serde.workspace       = true
toml.workspace        = true
dirs.workspace        = true

# ── TUI-only deps (not shared — terminal/UI specific) ─────────────────────────

# Terminal UI framework
ratatui = "0.29"

# Low-level terminal control — raw mode, alternate screen, keyboard/mouse events
crossterm = "0.28"

# Production-grade text input widget — cursor, undo/redo, multi-line editing
tui-textarea = "0.7"

# Cross-platform clipboard access
arboard = "3.4"
